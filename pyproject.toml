[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folate"
version = "0.1.1"
description = "A lightweight, CPU-efficient neural DOM element ranker built for browser automation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Figranium" },
]
keywords = ["dom", "browser-automation", "playwright", "onnx", "web-agent", "selector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "onnxruntime>=1.18.0",
  "tokenizers>=0.20.0",
  "lxml>=5.0.0",
  "numpy>=1.26.0",
  "psutil>=5.9.0",
  "huggingface-hub>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/figranium/folate"
Repository = "https://github.com/figranium/folate"
"Hugging Face" = "https://huggingface.co/figranium/folate"

[tool.setuptools.packages.find]
include = ["folate*"]
